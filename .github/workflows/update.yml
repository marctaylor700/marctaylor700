name: Update card
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [update.py]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
        env:
          # Required repo secret. No fallback to github.token: that token only sees public data,
          # so a missing secret would quietly overwrite the card with near-empty stats.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: |
          git add card.svg
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update stats"
          git push
