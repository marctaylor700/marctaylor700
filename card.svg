@keyframes legs{0%{opacity:1}50%{opacity:0}}
@keyframes shot{70%{transform:translateX(53px);opacity:1}71%,100%{transform:translateX(53px);opacity:0}}
@keyframes spark{0%,69%{opacity:0}72%{opacity:1}100%{opacity:0}}
@keyframes recoil{0%{transform:translateX(7px);opacity:.35}3.12%,100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
