<style>text{white-space:pre;animation:recoil 12.8s ease-out infinite}
.h{fill:#f0f6fc;font-weight:bold}.k{fill:#ffa657}.d{fill:#484f58}.v{fill:#a5d6ff}
.ship{animation:patrol 12.8s step-end infinite}
